<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e2a1b"/>
      <stop offset="70%" stop-color="#06160e"/>
      <stop offset="100%" stop-color="#020805"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="85" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>
  <rect x="28" y="28" width="456" height="456" rx="75" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Ornate Corner Stars -->
  <text x="55" y="65" font-size="22" fill="#eab308" text-anchor="middle">✦</text>
  <text x="457" y="65" font-size="22" fill="#eab308" text-anchor="middle">✦</text>
  <text x="55" y="465" font-size="22" fill="#eab308" text-anchor="middle">✦</text>
  <text x="457" y="465" font-size="22" fill="#eab308" text-anchor="middle">✦</text>

  <!-- Sun & Moon Celestial Synthesis -->
  <!-- Sun Rays behind Moon -->
  <g stroke="#eab308" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <line x1="256" y1="90" x2="256" y2="120"/>
    <line x1="256" y1="280" x2="256" y2="310"/>
    <line x1="160" y1="200" x2="130" y2="200"/>
    <line x1="352" y1="200" x2="382" y2="200"/>
    <line x1="188" y1="132" x2="168" y2="112"/>
    <line x1="324" y1="268" x2="344" y2="288"/>
    <line x1="188" y1="268" x2="168" y2="288"/>
    <line x1="324" y1="132" x2="344" y2="112"/>
  </g>

  <!-- Golden Crescent Moon -->
  <path d="M 270 120 A 80 80 0 1 0 270 280 A 62 62 0 1 1 270 120 Z" fill="url(#goldGrad)"/>

  <!-- Sprouting Wheat / Plant Stalk -->
  <g fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 256 310 Q 256 240 256 195"/>
    <path d="M 256 260 Q 225 240 215 220 Q 240 235 256 250"/>
    <path d="M 256 240 Q 287 220 297 200 Q 272 215 256 230"/>
    <path d="M 256 215 Q 235 190 230 170 Q 248 190 256 205"/>
    <path d="M 256 195 Q 277 170 282 150 Q 264 170 256 185"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="375" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="800" fill="url(#goldGrad)" letter-spacing="4">USALMANAC</text>
  <text x="256" y="415" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" letter-spacing="5">DIGITAL FARMER'S ALMANAC</text>
  <text x="256" y="440" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="2">EST. 2026 • LUNAR & USDA API</text>
</svg>
